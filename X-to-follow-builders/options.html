<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>空来Ai-X日报账号采集器 · 管理中心</title>
  <link rel="stylesheet" href="gasgx-ui-v61.css">
  <style>
    :root {
      color-scheme: dark;
      --bg-main: #0f0f0f;
      --bg-card: #202020;
      --text-primary: #e0e0e0;
      --text-secondary: #888888;
      --border-line: #333333;
      --accent-aurora: #5dd62c;
      --accent-aurora-rgb: 93, 214, 44;
      --accent-aurora-rgb-40: rgba(93, 214, 44, 0.4);
      --accent-aurora-rgb-15: rgba(93, 214, 44, 0.15);
      --status-success: #28a745;
      --status-warning: #ff9900;
      --status-danger: #ff3366;
      --status-info: #00a3ff;
      --glass-bg: rgba(32, 32, 32, 0.7);
      --glass-border: rgba(93, 214, 44, 0.15);
      --control-bg: #131313;
      --title-gradient: linear-gradient(120deg, #5dd62c 0%, #00a3ff 100%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg-main: #f5f7fa;
        --bg-card: #ffffff;
        --text-primary: #1a1a1a;
        --text-secondary: #666666;
        --border-line: #ebeef5;
        --accent-aurora: #00b853;
        --accent-aurora-rgb: 0, 184, 83;
        --accent-aurora-rgb-40: rgba(0, 184, 83, 0.4);
        --accent-aurora-rgb-15: rgba(0, 184, 83, 0.15);
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 184, 83, 0.1);
        --control-bg: #f8fafc;
        --title-gradient: linear-gradient(120deg, #00b853 0%, #00a3ff 100%);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text-primary);
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(var(--accent-aurora-rgb), 0.16) 0%, transparent 58%),
        radial-gradient(120% 90% at 100% 100%, rgba(0, 163, 255, 0.16) 0%, transparent 56%),
        var(--bg-main);
      line-height: 1.4;
    }

    .data-numbers {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
      line-height: 1.2;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .status {
      max-width: 45%;
      font-size: 12px;
      color: var(--status-info);
      white-space: pre-wrap;
      text-align: right;
      line-height: 1.5;
    }

    .layout {
      display: grid;
      grid-template-columns: 304px 1fr;
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 72px);
    }

    .panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .panel-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      font-size: 14px;
      color: var(--accent-aurora);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .create-btn {
      width: auto;
      flex: 0 0 auto;
      flex-shrink: 0;
      white-space: nowrap;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border-line);
      background: var(--control-bg);
      color: var(--accent-aurora);
      cursor: pointer;
    }

    .create-btn:hover {
      border-color: var(--accent-aurora);
      background: var(--accent-aurora-rgb-15);
      color: var(--accent-aurora);
    }

    .pool-list {
      max-height: calc(100vh - 208px);
      overflow: auto;
      border: 1px solid var(--border-line);
      border-radius: 8px;
      background: var(--control-bg);
    }

    .pool-item {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-line);
      border-left: 2px solid transparent;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .pool-item:last-child { border-bottom: none; }

    .pool-item:hover,
    .pool-item.active {
      background: var(--accent-aurora-rgb-15);
      color: var(--accent-aurora);
      border-left-color: var(--accent-aurora);
    }

    .pool-label {
      min-width: 0;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pool-row-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 4px;
      border: 1px solid var(--border-line);
      background: var(--control-bg);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent-aurora);
      background: var(--accent-aurora-rgb-15);
      color: var(--accent-aurora);
    }

    .icon-btn.danger {
      background: rgba(255, 51, 102, 0.14);
      color: var(--status-danger);
      border-color: rgba(255, 51, 102, 0.45);
    }

    .icon-btn.danger:hover {
      background: rgba(255, 51, 102, 0.2);
      border-color: var(--status-danger);
      color: var(--status-danger);
    }

    .pool-count {
      width: 32px;
      text-align: right;
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    .pool-hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 152px 168px;
      gap: 8px;
      margin-bottom: 8px;
    }

    .write-diagnostics {
      margin-bottom: 8px;
      padding: 8px 12px;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
    }

    .write-diagnostics-title {
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .write-diagnostics-body {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    .write-diagnostics-body.error {
      color: var(--status-danger);
    }

    .bulk-toolbar {
      display: grid;
      grid-template-columns: auto 1fr 176px 104px 92px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .bulk-toolbar .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .bulk-toolbar .selected-count {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .bulk-toolbar .selected-count strong {
      color: var(--accent-aurora);
      font-weight: 700;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    input,
    select,
    button {
      width: 100%;
      border: 1px solid var(--border-line);
      background: var(--control-bg);
      color: var(--text-primary);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 13px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, background-color 0.2s ease;
    }

    select {
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%),
        linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
      background-position:
        calc(100% - 14px) calc(50% - 2px),
        calc(100% - 10px) calc(50% - 2px);
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }

    select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    input:focus,
    select:focus,
    button:focus {
      outline: none;
      border-color: var(--accent-aurora);
      box-shadow: 0 0 0 2px rgba(var(--accent-aurora-rgb), 0.2);
    }

    button {
      cursor: pointer;
      font-weight: 600;
    }

    button.primary {
      border-color: var(--accent-aurora);
      background: var(--accent-aurora);
      color: #0a120a;
      box-shadow: 0 0 12px var(--accent-aurora-rgb-40);
      animation: breathe-glow 2s ease-in-out infinite;
      font-weight: 700;
    }

    button.primary:hover {
      filter: brightness(1.06);
    }

    .account-list {
      max-height: calc(100vh - 252px);
      overflow: auto;
      display: grid;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--border-line);
      border-radius: 8px;
      background: var(--control-bg);
    }

    .account-card {
      display: grid;
      grid-template-columns: 20px 48px 1fr;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--border-line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.08);
    }

    input[type='checkbox'],
    .row-check {
      width: 16px !important;
      height: 16px !important;
      flex-shrink: 0 !important;
      box-sizing: border-box;
      margin: 0;
      accent-color: var(--accent-aurora);
      cursor: pointer;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border-line);
      object-fit: cover;
      background: var(--control-bg);
    }

    .avatar-fallback {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border-line);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--control-bg);
    }

    .meta .name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .meta .sub {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-all;
    }

    .meta .link {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--status-info);
      text-decoration: none;
      word-break: break-all;
    }

    .meta .link:hover {
      color: var(--accent-aurora);
      text-decoration: underline;
    }

    .actions {
      margin-top: 8px;
      display: grid;
      grid-template-columns: minmax(160px, 224px) auto auto;
      gap: 8px;
      align-items: center;
      justify-content: end;
    }

    .actions select,
    .actions button {
      padding: 8px;
      font-size: 12px;
    }

    .actions select {
      width: 224px;
      max-width: 224px;
    }

    .actions button.danger {
      background: rgba(255, 51, 102, 0.14);
      color: var(--status-danger);
      border-color: rgba(255, 51, 102, 0.45);
    }

    .actions button.danger:hover {
      background: rgba(255, 51, 102, 0.2);
      border-color: var(--status-danger);
    }

    .busy-mask,
    .modal-mask {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      background: rgba(8, 10, 14, 0.65);
      backdrop-filter: blur(2px);
    }

    .busy-mask.show,
    .modal-mask.show {
      display: flex;
    }

    .busy-card,
    .modal-card {
      width: min(92vw, 460px);
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-primary);
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
    }

    .busy-card {
      width: auto;
      min-width: 240px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(var(--accent-aurora-rgb), 0.25);
      border-top-color: var(--accent-aurora);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      flex-shrink: 0;
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      color: var(--accent-aurora);
    }

    .modal-desc {
      margin: 8px 0 16px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .modal-fields {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .modal-field label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-actions .danger {
      background: rgba(255, 51, 102, 0.14);
      color: var(--status-danger);
      border-color: rgba(255, 51, 102, 0.45);
    }

    .form-item-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .custom-dropdown-item {
      background-color: transparent;
      color: var(--text-primary) !important;
      border-left: 2px solid transparent;
    }

    .custom-dropdown-item:hover,
    .custom-dropdown-item.is-selected {
      background-color: var(--accent-aurora-rgb-15) !important;
      color: var(--accent-aurora) !important;
      border-left-color: var(--accent-aurora);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes breathe-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(var(--accent-aurora-rgb), 0.3); }
      50% { box-shadow: 0 0 18px rgba(var(--accent-aurora-rgb), 0.8); }
    }

    @media (max-width: 1120px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .pool-list {
        max-height: 320px;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .status {
        max-width: 100%;
        text-align: left;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .bulk-toolbar {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
        justify-items: stretch;
      }

      .actions select {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>空来Ai-X日报账号采集器 · 管理中心</h1>
    <div class="status" id="status">就绪</div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-title-row">
        <h2>集合管理</h2>
        <button id="addPoolInlineBtn" class="create-btn">+ 增加集合</button>
      </div>
      <div class="pool-list" id="poolList"></div>
      <div class="pool-hint">
        行内图标说明：<br />
        `+` 新增账号，`⭳` 导出 JSON，`✎` 改名，`🗑` 删除。
      </div>
    </div>

    <div class="panel">
      <h2 id="currentPoolTitle">账号池</h2>
      <div class="write-diagnostics">
        <div class="write-diagnostics-title">Last DB write</div>
        <div class="write-diagnostics-body" id="writeResult">No write records yet.</div>
      </div>
      <div class="toolbar">
        <input id="searchInput" placeholder="搜索账号名 / handle / 链接" />
        <button id="refreshBtn">刷新数据库</button>
        <button id="importClipboardBtn" class="primary">剪贴板入池</button>
      </div>
      <div class="bulk-toolbar">
        <label class="toggle">
          <input type="checkbox" id="selectAllToggle" />
          全选
        </label>
        <div class="selected-count" id="selectedCount">已选 <strong>0</strong></div>
        <select id="bulkMoveTarget"></select>
        <button id="bulkMoveBtn">批量移动</button>
        <button id="clearSelectionBtn">清空</button>
      </div>
      <div class="account-list" id="accountList"></div>
    </div>
  </div>

  <div class="busy-mask" id="busyMask">
    <div class="busy-card">
      <div class="spinner"></div>
      <div id="busyText">连接数据库中...</div>
    </div>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal-card">
      <h3 class="modal-title" id="modalTitle">标题</h3>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-fields" id="modalFields"></div>
      <div class="modal-actions">
        <button id="modalCancelBtn">取消</button>
        <button id="modalConfirmBtn" class="primary">确认</button>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
